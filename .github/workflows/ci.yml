name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        module: [kit, kit/pb, core, dev, pocketbase, deploy/traefik/plugins/platformstrip, template/go-pocketbase/backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: "off" # each module must build on its own (replace directives point at siblings)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x" # latest patch release, so govulncheck checks a patched stdlib
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  kit-js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  kit-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kit-py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install .
      - run: python -m unittest discover -s tests

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/go-pocketbase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: VITE_BASE=/myapp/ npm run build

  template-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: cd kit-js && npm ci
      - run: cd template/next && npm ci && npm run typecheck && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  template-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt ../../kit-py
      - run: python -m pytest -q
