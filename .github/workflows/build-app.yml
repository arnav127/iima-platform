# The platform's build for app repos. An app calls it from its own workflow (see the templates'
# .github/workflows/deploy.yml); on every push it builds the app for the cluster and publishes a
# GitHub release build-<commit> with app.tar.gz and app.tar.gz.sha256. The deploy portal picks the
# release up and deploys it. Builds run here, on GitHub, so no app's install scripts ever run on
# campus servers.
#
# What app.tar.gz holds, by shape (app.toml):
#   go-pocketbase  ./app (Linux binary), ./pb_public (the built frontend)
#   go             ./app
#   next           ./app/server.js (Next's standalone server); with backend = "..." also ./backend
#                  (the Python backend's code) and ./site (its dependencies)
#   python         ./app (the code) and ./site (its dependencies, iimakit included)
#   with pocketbase = true (next, python) also ./pocketbase (the platform's pinned build),
#   ./pb_migrations and ./pb_hooks
name: build-app

on:
  workflow_call:
    inputs:
      backend-dir:
        description: Go apps, the Go module to build (relative to the repo root)
        type: string
        default: backend
      public-dir:
        description: PocketBase apps, where the frontend build lands
        type: string
        default: backend/pb_public
      web-dir:
        description: Next.js apps, the folder with package.json and next.config
        type: string
        default: "."
      python-backend-dir:
        description: Next.js apps with backend = "..." in app.toml, the Python backend's folder
        type: string
        default: backend
      pocketbase-dir:
        description: Apps with pocketbase = true, the folder holding pb_migrations and pb_hooks
        type: string
        default: "."
      python-version:
        description: Python apps, the cluster's Python (dependencies are installed for it)
        type: string
        default: "3.12"
      platform-ref:
        description: Which iima-platform commit to build the kits and PocketBase from
        type: string
        default: main

permissions:
  contents: write # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      # Apps point at ../iima-platform for the kits until they are published.
      - uses: actions/checkout@v5
        with:
          repository: arnav127/iima-platform
          ref: ${{ inputs.platform-ref }}
          path: iima-platform

      - name: Read app.toml
        id: app
        working-directory: app
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import tomllib
          a = tomllib.load(open("app.toml", "rb"))
          print("id=" + a["id"])
          print("path=" + a["path"])
          print("base=" + a["path"].rstrip("/") + "/")
          print("shape=" + a.get("shape", ""))
          print("pocketbase=" + str(a.get("pocketbase", False)).lower())
          print("backend=" + a.get("backend", ""))
          EOF

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          check-latest: true
      - name: Kit dependencies
        run: cd iima-platform/kit-js && npm ci

      # ---- Go apps ----
      - name: Build the frontend
        if: (steps.app.outputs.shape == 'go' || steps.app.outputs.shape == 'go-pocketbase') && hashFiles('app/package.json') != ''
        working-directory: app
        env:
          VITE_BASE: ${{ steps.app.outputs.base }}
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Test and build the backend
        if: steps.app.outputs.shape == 'go' || steps.app.outputs.shape == 'go-pocketbase'
        working-directory: app/${{ inputs.backend-dir }}
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          mkdir -p "$GITHUB_WORKSPACE/dist"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/app" .
          if [ "${{ steps.app.outputs.shape }}" = "go-pocketbase" ]; then
            cp -r "$GITHUB_WORKSPACE/app/${{ inputs.public-dir }}" "$GITHUB_WORKSPACE/dist/pb_public"
          fi

      # ---- Next.js apps ----
      - name: Build the Next.js app
        if: steps.app.outputs.shape == 'next'
        working-directory: app/${{ inputs.web-dir }}
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
          test -d .next/standalone || { echo "next.config needs output: 'standalone'"; exit 1; }
          # With the kit linked from ../iima-platform, Next nests the app inside standalone/; find it.
          server=$(find .next/standalone -name server.js -not -path '*/node_modules/*' | head -1)
          sub=$(dirname "${server#.next/standalone/}")
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp -r .next/standalone "$GITHUB_WORKSPACE/dist/app"
          cp -r .next/static "$GITHUB_WORKSPACE/dist/app/$sub/.next/static"
          if [ -d public ]; then cp -r public "$GITHUB_WORKSPACE/dist/app/$sub/public"; fi
          if [ "$sub" != "." ]; then echo "require('./$sub/server.js')" > "$GITHUB_WORKSPACE/dist/app/server.js"; fi
      # ---- Python apps ----
      - uses: actions/setup-python@v6
        if: steps.app.outputs.shape == 'python' || steps.app.outputs.backend != ''
        with:
          python-version: ${{ inputs.python-version }}
      - name: Test and package the Python app
        if: steps.app.outputs.shape == 'python'
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ../iima-platform/kit-py pytest
          if [ -d tests ]; then python -m pytest -q; fi
          mkdir -p "$GITHUB_WORKSPACE/dist/site" "$GITHUB_WORKSPACE/dist/app"
          # Dependencies for the cluster's Python (same minor version), next to the code.
          python -m pip install --target "$GITHUB_WORKSPACE/dist/site" -r requirements.txt ../iima-platform/kit-py
          tar -cf - --exclude=.git --exclude=.github --exclude=tests --exclude=.venv --exclude=__pycache__ \
            --exclude=pb_migrations --exclude=pb_hooks . | tar -xf - -C "$GITHUB_WORKSPACE/dist/app"

      - name: Pack the Python backend
        if: steps.app.outputs.shape == 'next' && steps.app.outputs.backend != ''
        working-directory: app/${{ inputs.python-backend-dir }}
        run: |
          python -m pip install --upgrade pip
          if [ -d tests ]; then python -m pip install -r requirements.txt "$GITHUB_WORKSPACE/iima-platform/kit-py" pytest && python -m pytest -q; fi
          mkdir -p "$GITHUB_WORKSPACE/dist/site" "$GITHUB_WORKSPACE/dist/backend"
          python -m pip install --target "$GITHUB_WORKSPACE/dist/site" -r requirements.txt "$GITHUB_WORKSPACE/iima-platform/kit-py"
          tar -cf - --exclude=tests --exclude=.venv --exclude=venv --exclude=__pycache__ --exclude=.env . | tar -xf - -C "$GITHUB_WORKSPACE/dist/backend"

      - name: Add the platform's PocketBase
        if: (steps.app.outputs.shape == 'next' || steps.app.outputs.shape == 'python') && steps.app.outputs.pocketbase == 'true'
        run: |
          (cd iima-platform/pocketbase && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/dist/pocketbase" .)
          mkdir -p dist/pb_migrations dist/pb_hooks
          pbdir="app/${{ inputs.pocketbase-dir }}"
          if [ -d "$pbdir/pb_migrations" ]; then cp -r "$pbdir/pb_migrations/." dist/pb_migrations/; fi
          if [ -d "$pbdir/pb_hooks" ]; then cp -r "$pbdir/pb_hooks/." dist/pb_hooks/; fi

      - name: Package
        run: |
          tar -czf app.tar.gz -C dist .
          sha256sum app.tar.gz > app.tar.gz.sha256
          cat app.tar.gz.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::7}"
          gh release create "$tag" app.tar.gz app.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes "Build of $GITHUB_SHA for students.iima.ac.in${{ steps.app.outputs.path }}"
