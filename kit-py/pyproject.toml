[project]
name = "iimakit"
version = "0.1.0"
description = "Platform kit for Python apps behind the students.iima.ac.in gateway"
requires-python = ">=3.11"
dependencies = ["pyjwt[crypto]>=2.10,<3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["iimakit"]
